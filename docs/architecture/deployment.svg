<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Delivery pipeline</text>

  <rect x="30" y="150" width="150" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="105" y="185" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Push to main</text>
  <text x="105" y="207" text-anchor="middle" font-size="12" fill="#4b5563">GitHub</text>

  <rect x="230" y="150" width="200" height="90" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="330" y="185" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">CI workflow</text>
  <text x="330" y="207" text-anchor="middle" font-size="12" fill="#4b5563">Maven verify, panel, landing</text>

  <rect x="480" y="150" width="200" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="580" y="185" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">Deploy workflow</text>
  <text x="580" y="207" text-anchor="middle" font-size="12" fill="#4b5563">starts only after CI passes</text>

  <rect x="740" y="90" width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="840" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">App Service</text>
  <text x="840" y="144" text-anchor="middle" font-size="12" fill="#4b5563">jar from the CI run</text>

  <rect x="740" y="230" width="200" height="80" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="840" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">Static Web App</text>
  <text x="840" y="284" text-anchor="middle" font-size="12" fill="#4b5563">landing and panel build</text>

  <line x1="180" y1="195" x2="228" y2="195" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="195" x2="478" y2="195" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="180" x2="738" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="210" x2="738" y2="260" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="365" text-anchor="middle" font-size="11" fill="#6b7280">Pull requests get a Static Web App preview; main deploys only after its CI run succeeds.</text>
</svg>
