<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">System context</text>

  <rect x="30" y="200" width="150" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="105" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Athlete</text>
  <text x="105" y="257" text-anchor="middle" font-size="12" fill="#4b5563">Browser</text>

  <rect x="30" y="360" width="150" height="90" rx="10" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="105" y="395" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Organizer</text>
  <text x="105" y="417" text-anchor="middle" font-size="12" fill="#4b5563">Admin panel user</text>

  <rect x="250" y="150" width="260" height="230" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="380" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">Azure Static Web App</text>
  <rect x="270" y="195" width="220" height="60" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="380" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Landing (Vite)</text>
  <text x="380" y="240" text-anchor="middle" font-size="12" fill="#4b5563">/ and /inscripciones/{slug}</text>
  <rect x="270" y="275" width="220" height="90" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="380" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Admin panel (Next.js)</text>
  <text x="380" y="320" text-anchor="middle" font-size="12" fill="#4b5563">/panel: admin, athlete portal,</text>
  <text x="380" y="338" text-anchor="middle" font-size="12" fill="#4b5563">public registration form</text>

  <rect x="610" y="150" width="310" height="230" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="765" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Azure App Service (Linux, Java 21)</text>
  <rect x="630" y="195" width="270" height="60" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="765" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Registrations REST API</text>
  <text x="765" y="240" text-anchor="middle" font-size="12" fill="#4b5563">Spring Boot 3.5, JWT, Flyway</text>
  <rect x="630" y="275" width="270" height="90" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="765" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Database</text>
  <text x="765" y="320" text-anchor="middle" font-size="12" fill="#4b5563">SQLite file (default)</text>
  <text x="765" y="338" text-anchor="middle" font-size="12" fill="#4b5563">or PostgreSQL (profile)</text>

  <rect x="610" y="415" width="310" height="70" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="765" y="443" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">WhatsApp Cloud API (Meta)</text>
  <text x="765" y="463" text-anchor="middle" font-size="12" fill="#4b5563">Campaigns and webhooks</text>

  <line x1="180" y1="245" x2="248" y2="245" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="405" x2="248" y2="330" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="512" y1="225" x2="608" y2="225" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="214" text-anchor="middle" font-size="11" fill="#374151">HTTPS /api/*</text>
  <line x1="765" y1="380" x2="765" y2="413" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780" y="402" font-size="11" fill="#374151">Graph API</text>
  <text x="480" y="500" text-anchor="middle" font-size="11" fill="#6b7280">The panel and the landing share one origin; the API is called cross-origin and must allow it in CORS_ORIGINS.</text>
</svg>
