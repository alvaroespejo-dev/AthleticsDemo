name: CI

# Installs dependencies and compiles every project on GitHub. It does not deploy anything:
# the deploy-azure workflow is run by hand once a commit is ready.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AEspejo.Registrations.Backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: src/AEspejo.Registrations.Backend/pom.xml

      # The Maven wrapper may lose its executable bit when the repository is checked out on Windows.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile and run tests
        run: ./mvnw -B verify

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: src/AEspejo.Registrations.Backend/target/*.jar
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Admin panel (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AEspejo.Registrations.Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/AEspejo.Registrations.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  landing:
    name: Landing (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AEspejo.Landing.AthleticsDemo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/AEspejo.Landing.AthleticsDemo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
