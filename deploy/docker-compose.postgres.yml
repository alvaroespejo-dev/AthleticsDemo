# PostgreSQL for local development of the backend. Flyway creates the schema when the API starts.
services:
  postgres:
    image: postgres:17-alpine
    container_name: registrations-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: registrations
      POSTGRES_USER: registrations
      # Define it in a .env file next to this compose file; never commit the password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registrations -d registrations"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
