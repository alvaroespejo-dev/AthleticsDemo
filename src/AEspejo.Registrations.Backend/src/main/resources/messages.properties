Manifiesto encontrarme en condiciones físicas y de salud adecuadas para completar la
distancia en la que me inscribo, y que no tengo conocimiento de ninguna condición
médica que me lo impida. Asumo que es mi responsabilidad haberme sometido a los
controles médicos que correspondan.

Eximo a la organización, a sus auspiciadores y al personal del evento de toda
responsabilidad por lesiones, accidentes, daños o pérdidas que pudiera sufrir antes,
durante o después de la competencia, salvo aquellos que resulten de dolo o culpa grave
de la organización.

Me comprometo a respetar el reglamento de la prueba, el recorrido señalizado y las
indicaciones del personal de organización y de seguridad. Entiendo que la organización
puede suspender o modificar el evento por razones de fuerza mayor o de seguridad.

Autorizo el uso de mi nombre y de las imágenes tomadas durante el evento con fines de
difusión deportiva de esta y futuras ediciones, sin derecho a compensación.

Declaro que los datos que proporciono son verídicos y autorizo su tratamiento para la
organización del evento y la entrega de resultados.
